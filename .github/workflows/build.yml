name: Build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Liquid Glass .icon resource requires Xcode/macOS 26. The produced app still
    # targets macOS 14 through Package.swift and Info.plist.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test
      - name: Verify release automation
        run: python3 -m unittest discover -s Tests/ReleaseAutomation -v
      - name: Verify community automation
        run: python3 -m unittest discover -s Tests/CommunityAutomation -v

      - name: Build and package app bundle
        run: ./Scripts/package_app.sh

      - name: Verify DMG background contrast
        run: swift Tests/dmg_background_contrast_test.swift Resources/DMG/dmg-background.jpeg

      - name: Verify release DMG
        run: ./Tests/release_dmg_test.sh
