name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches the app version
        shell: zsh {0}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build app bundle
        run: ./Scripts/package_app.sh

      - name: Verify DMG background contrast
        run: swift Tests/dmg_background_contrast_test.swift Resources/DMG/dmg-background.jpeg

      - name: Create and verify DMG
        shell: zsh {0}
        run: |
          dmg_path=$(./Scripts/create_dmg.sh)
          hdiutil verify "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Create checksum
        shell: zsh {0}
        run: |
          cd "$(dirname "$DMG_PATH")"
          shasum -a 256 "$(basename "$DMG_PATH")" > SHA256SUMS

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            "$(dirname "$DMG_PATH")/SHA256SUMS" \
            --draft \
            --prerelease \
            --generate-notes \
            --title "WandelBar ${GITHUB_REF_NAME#v}"
