name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a trusted release source
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            [[ "$RELEASE_REF" == refs/heads/master ]]
          else
            [[ "$RELEASE_REF" == refs/tags/v* && "$RELEASE_NAME" == "v$version" ]]
          fi
      - name: Test
        run: swift test
      - name: Verify release automation
        run: python3 -m unittest discover -s Tests/ReleaseAutomation -v
      - name: Verify community automation
        run: python3 -m unittest discover -s Tests/CommunityAutomation -v
      - name: Verify DMG background contrast
        run: swift Tests/dmg_background_contrast_test.swift Resources/DMG/dmg-background.jpeg

  sign:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, sign, notarize and verify
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WANDELBAR_SIGNING_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
        run: ./Scripts/ci_signed_release.sh
      - name: Remove signing material on cancellation or failure
        if: always()
        shell: zsh {0}
        run: |
          for directory in "$RUNNER_TEMP"/wandelbar-signing.*(N/); do
            security delete-keychain "$directory/release.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$directory"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WandelBar-notarized
          path: Build/Release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WandelBar-notarized
          path: release
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          python3 ../Scripts/release_notes.py "${RELEASE_TAG#v}" ../CHANGELOG.md > notes.md
          gh release create "$RELEASE_TAG" ./*.dmg appcast.xml SHA256SUMS \
            --draft --prerelease --verify-tag --notes-file notes.md \
            --title "WandelBar ${RELEASE_TAG#v}"
