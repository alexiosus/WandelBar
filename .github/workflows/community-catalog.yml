name: Community catalogue

on:
  discussion:
    types: [labeled, unlabeled, edited, deleted, transferred, category_changed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    if: github.repository == 'alexiosus/WandelBar' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      discussions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test catalogue automation
        run: python3 -m unittest discover -s Tests/CommunityAutomation -v
      - name: Validate approval and package (no signing secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/community_catalog.py validate --evidence validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogue-validation
          path: validation.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 15
    environment: community-catalog
    permissions:
      contents: write
      discussions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalogue-validation
          path: validation
      - name: Recheck approval, sign and publish JSON only
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: python3 Scripts/community_catalog.py publish --evidence validation/validation.json
